name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dprint/check@v2.5
        env:
          # Keep in step with mise.toml: without this the action resolves the
          # latest release, so CI and a local `dprint check` can disagree the
          # day a formatter release changes markdown output.
          DPRINT_VERSION: 0.64.3

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.11 is the floor the tooling promises; 3.13 keeps that honest.
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # Any skill may ship a Python suite under <skill>/tests/.
      - name: Python suites
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          suites=(*/tests)
          if [ ${#suites[@]} -eq 0 ]; then
            echo "no Python test suites found"
            exit 0
          fi
          for suite in "${suites[@]}"; do
            echo "::group::${suite}"
            python3 -m unittest discover -s "$suite" -v
            echo "::endgroup::"
          done

      # Any skill may ship a shell suite at <skill>/test.sh.
      - name: Shell suites
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          suites=(*/test.sh)
          if [ ${#suites[@]} -eq 0 ]; then
            echo "no shell test suites found"
            exit 0
          fi
          for suite in "${suites[@]}"; do
            echo "::group::${suite}"
            bash "$suite"
            echo "::endgroup::"
          done
